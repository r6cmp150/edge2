<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- PWA / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EDGE">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#080c10">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">

  <title>EDGE Trade Signals</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="app-header">
      <div class="header-brand">
        <span class="header-logo">EDGE</span>
        <span class="header-tagline">Trade Signals</span>
      </div>
      <div class="header-actions">
        <button id="refresh-btn" class="btn-refresh" onclick="handleRefresh()" title="Refresh">↻</button>
      </div>
    </header>

    <!-- Market Status Banner -->
    <div id="market-banner" class="market-banner"></div>

    <!-- New Version Available Banner (hidden until a SW update is detected) -->
    <div id="update-banner" class="update-banner hidden" onclick="confirmForceUpdate()">
      <span>🔄 New version available — tap to update</span>
    </div>

    <!-- Budget Bar (signals/portfolio/watchlist only) -->
    <div id="budget-bar" class="budget-bar hidden"></div>

    <!-- Main Tab Content -->
    <main id="tab-content" class="tab-content"></main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav">
      <button class="nav-btn active" data-tab="signals" onclick="switchTab('signals')">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Signals</span>
      </button>
      <button class="nav-btn" data-tab="warrior" onclick="switchTab('warrior')">
        <span class="nav-icon">🥋</span>
        <span class="nav-label">Warrior</span>
      </button>
      <button class="nav-btn" data-tab="portfolio" onclick="switchTab('portfolio')">
        <span class="nav-icon">💼</span>
        <span class="nav-label">Portfolio</span>
        <span id="badge-portfolio" class="nav-badge hidden">0</span>
      </button>
      <button class="nav-btn" data-tab="sold" onclick="switchTab('sold')">
        <span class="nav-icon">✅</span>
        <span class="nav-label">Sold</span>
      </button>
      <button class="nav-btn" data-tab="settings" onclick="switchTab('settings')">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Settings</span>
      </button>
    </nav>
  </div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="handleOverlayClick(event)">
    <div id="modal-container" class="modal-container" onclick="event.stopPropagation()">
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Confirmation Dialog -->
  <div id="confirm-overlay" class="modal-overlay hidden" onclick="closeConfirm()">
    <div class="confirm-box" onclick="event.stopPropagation()">
      <p id="confirm-msg"></p>
      <div class="confirm-btns">
        <button id="confirm-btn" class="btn-danger" onclick="confirmAction()">Confirm</button>
        <button class="btn-ghost" onclick="closeConfirm()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Bump ?v= to match VERSION in app.js on every release — these scripts are
       served with a 10-minute browser cache (GitHub Pages default), and mobile
       browsers/PWAs can hold onto it well past that without a cache-busting
       query change.

       core/*.js load first: they're classic (non-module) scripts sharing one
       global scope with app.js, loaded in the dependency order app.js needs
       (api-client before market-data/news, everything before app.js's own
       top-level code runs). See CLAUDE.md for the isolation rules these files
       must keep to, and scripts/check-boundaries.sh for the enforcement.

       shell/registry.js loads last of the classic scripts, right before
       app.js — it only needs to exist as a global before app.js's dynamic
       import() of engines/warrior/index.js resolves and calls register().
       engines/warrior/index.js is NOT listed here: it's a real ES module,
       fetched only via that one dynamic import() call at runtime, never a
       <script> tag — that's what keeps a syntax error in Warrior code from
       blocking page parse. See docs/warrior-engine-spec-v2.md Phase 2. -->
  <script src="core/clock.js?v=20260905120000"></script>
  <script src="core/indicators.js?v=20260905120000"></script>
  <script src="core/api-client.js?v=20260905120000"></script>
  <script src="core/market-data.js?v=20260905120000"></script>
  <script src="core/news.js?v=20260905120000"></script>
  <script src="core/store.js?v=20260905120000"></script>
  <script src="core/float-table.js?v=20260905120000"></script>
  <script src="core/universe.js?v=20260905120000"></script>
  <script src="shell/registry.js?v=20260905120000"></script>
  <script src="app.js?v=20260905120000"></script>
</body>
</html>
