# The macro classifier's capability test (2026-11-19, the reviewer): can Groq give a minority answer to the production
# question? scripts/macro-capability-test.mjs says what each arm asks, the budget and the stop rule. Manual only: one
# arm per run, the run id and the full log are the record. It writes NOTHING to the database (it reads
# macro_observations with the anon key) and holds no production-write variable. GROQ_API_KEY is Roman's key, set by
# him as a repository secret; it is never printed. Arm order (declared): 1 first; then 3; then 2 if still warranted.
name: Macro capability test
on:
  workflow_dispatch:
    inputs:
      arm:
        description: 'Arm to run (1 = synthetic doubled, 3 = replay as stored, 2 = mirror)'
        required: true
        type: choice
        options: ['1', '3', '2']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run the arm (everything printed in full; exits 1 unless the arm is COMPLETE)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/macro-capability-test.mjs --arm "${{ github.event.inputs.arm }}"
