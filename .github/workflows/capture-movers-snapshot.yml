name: Capture movers/most-actives snapshot

# See scripts/capture-movers-snapshot.mjs's header comment for why this
# exists: Alpaca's movers/most-actives screener endpoints are
# live-snapshot-only, no historical query -- this is the only way that
# data ever becomes backtestable, and only from the point capture starts.
#
# 15:00 UTC ~= 10-11am ET depending on DST -- inside Warrior's
# momentum-window/mid session phases (see engines/warrior/replay.js's
# _sessionPhase), not the opening scramble or the quiet mid-day. Weekdays
# only; a weekend/holiday firing just logs a market-closed marker (see
# the script) rather than being skipped -- a gap in the log should never
# be ambiguous between "didn't run" and "market was shut."
on:
  schedule:
    - cron: '0 15 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Capture snapshot
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: node scripts/capture-movers-snapshot.mjs

      - name: Commit and push
        run: |
          git config user.name "movers-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/movers-snapshots/log.jsonl
          git diff --cached --quiet || git commit -m "Movers/most-actives snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
