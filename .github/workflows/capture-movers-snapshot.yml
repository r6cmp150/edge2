name: Capture movers/most-actives snapshot

# See scripts/capture-movers-snapshot.mjs's header comment for why this
# exists: Alpaca's movers/most-actives screener endpoints are
# live-snapshot-only, no historical query -- this is the only way that
# data ever becomes backtestable, and only from the point capture starts.
#
# Three captures per weekday, not one (2026-09-01 correction): the
# original single 15:00 UTC run (~10-11am ET depending on DST) landed
# AFTER the momentum window Warrior actually trades -- one snapshot is
# better than none, but this data is unrecoverable once a day passes
# uncaptured, so getting the timing right now matters more than it would
# for something re-runnable. 13:45/14:30/15:00 UTC ~= 9:45/10:30/11:00 ET
# (EDT) -- spans the actual opening momentum window through mid-morning
# rather than a single point past it. Weekdays only; a weekend/holiday
# firing just logs a market-closed marker (see the script) rather than
# being skipped -- a gap in the log should never be ambiguous between
# "didn't run" and "market was shut."
#
# EST TWIN ADDED (2026-09-10, checked against the actual script rather
# than trusted from this comment's own prior claim): the earlier version
# of this comment called the DST shift "harmless" because the script's
# real /v2/clock check correctly logs a self-marked {marketOpen:false}
# row instead of stale or misleading data -- that part is true and
# verified. What it missed: during EST, 13:45 UTC becomes 8:45am ET,
# genuinely pre-market, so that slot doesn't just drift, it's LOST
# entirely for the ~4 EST months each year -- a real gap in exactly the
# opening-momentum data this job exists to capture, not a cosmetic
# timing shift. 14:45 UTC is 13:45 UTC's EST-calibrated twin (9:45am ET
# under EST). On any given real day, whichever of the two isn't actually
# near the open logs a harmless closed-market marker via the existing
# /v2/clock check -- no script change needed, just the second cron entry.
# The other two slots (14:30/15:00 UTC) don't get twins: during EST they
# shift to 9:30am/10:00am ET, still inside real market hours, drifting
# earlier than intended but never losing the day. No historical gap to
# backfill either way -- this job started 2026-09-02 and the first DST
# transition after that is this November, so this fix lands before it
# would have bitten, not after.
on:
  schedule:
    - cron: '45 13 * * 1-5'
    - cron: '45 14 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '0 15 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Capture snapshot
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: node scripts/capture-movers-snapshot.mjs

      - name: Commit and push
        run: |
          git config user.name "movers-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/movers-snapshots/log.jsonl
          git diff --cached --quiet || git commit -m "Movers/most-actives snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
