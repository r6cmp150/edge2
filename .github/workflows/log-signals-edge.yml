name: Log EDGE signals

# Phase 7's second engine -- see scripts/log-signals-edge.mjs's header for
# the full design.
#
# SCHEDULE (2026-10-09) -- AIMED AT GITHUB'S OBSERVED DELIVERY, NOT AT THE
# INTENDED MOMENT. These crons are NOT the times scans happen.
#
# Measured from every run's declared_cron, Sep 15-Oct 8: GitHub delivers
# this repo's scheduled runs hours late, in order, compressed, and the
# delay SHRINKS the later the declared time (median declared -> delivered):
#   06:00Z -> ~11:55Z (backup-tables)     13:45Z -> ~19:00Z (movers)
#   14:00Z -> ~18:50Z (this file, old)    20:15Z -> ~23:45Z (this file, old)
# Jitter is +-1-2h day to day; both Mondays in the sample ran ~2h later.
# The old schedule (14:00-20:15Z, aimed at open+30/open+140/close-45)
# therefore delivered 11:45am-5pm PT -- never the 6:30-8:00am PT window
# Roman actually trades -- and the script's ±10-min target check turned
# nearly every delivery into a silent no-op (10 of 20 trading days had no
# EDGE row at all).
#
# TARGET: deliveries inside 13:30-15:00Z (6:30-8:00am PDT). A straight-line
# fit through the 06:00Z and 14:00Z points puts that at declared ~07:50-
# 09:35Z, so six entries across 07:30-09:40Z. THIS IS A FIT THROUGH AN
# UNINSTRUMENTED RANGE: nothing in this repo has ever declared a cron
# between 08:00Z and 13:45Z, so the interpolation spans exactly the part we
# care about. Revisit after one week of real deliveries (from 2026-10-12):
# pull actual_fired_at by declared_cron and re-aim.
#
# Missing the target is no longer fatal: scripts/lib/scan-gate.mjs scans
# on ANY delivery that lands in the regular session (subject to 30-min
# spacing), so a late delivery is a midday row, not a no-op. Only a
# delivery before the open is lost. Earliest-sighting-wins dedup in
# signal_log means that when this schedule works, a symbol's row is its
# morning sighting.
#
# DST -- NOV 1, 2026: ET falls back, the open moves from 13:30Z to 14:30Z,
# and the target becomes 14:30-16:00Z. Shift every entry below +1h at that
# point (and back -1h on the March DST change). The scan gate is DST-safe
# on its own (it reads PT wall clock); only the AIM changes.
#
# Alpaca rate budget: unchanged per run (~11 req, scales with filtered
# candidates); no entry shares a minute with capture-movers-snapshot
# (13:45/14:30/14:45/15:00Z) or backup-tables (06:00Z).
#
# dry_run input still defaults to true for a MANUAL workflow_dispatch --
# unaffected by the schedule going live in --write mode below. A schedule-
# triggered firing always runs with --write; dry_run is workflow_dispatch-
# only and reads as empty on a schedule trigger, so the run step branches
# on github.event_name, not just the input, to decide -- same asymmetry as
# log-signals-warrior.yml and for the same reason: signal_log is
# insert-only for anon, so a wrong row has no cleanup path short of the
# SQL editor.
on:
  schedule:
    - cron: '30 7 * * 1-5'
    - cron: '55 7 * * 1-5'
    - cron: '20 8 * * 1-5'
    - cron: '45 8 * * 1-5'
    - cron: '10 9 * * 1-5'
    - cron: '40 9 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = compute and log only, write nothing to Supabase. Must be explicitly set to false to write for real."
        required: true
        default: "true"

permissions:
  contents: write

jobs:
  log-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Log workflow firing (Phase 9 §2.7 scheduler instrumentation)
        id: log_fired
        run: |
          ROW=$(curl -s -X POST "https://kbjqxaukyawcmcyjoiey.supabase.co/rest/v1/workflow_runs" \
            -H "apikey: sb_publishable_JXOwCMF_a5ylZL8V5mwfzw_MRivRMpl" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"workflow_name\": \"${{ github.workflow }}\", \"trigger\": \"${{ github.event_name }}\", \"declared_cron\": \"${{ github.event.schedule }}\", \"actual_fired_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}")
          echo "$ROW"
          echo "id=$(echo "$ROW" | jq -r 'if type=="array" then (.[0].id // empty) else empty end' 2>/dev/null || echo)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run logger
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "false" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="--write"
          fi
          echo "Running: node scripts/log-signals-edge.mjs $ARGS"
          node scripts/log-signals-edge.mjs $ARGS

      - name: Log workflow outcome (Phase 9 §2.7)
        if: always()
        run: |
          ID="${{ steps.log_fired.outputs.id }}"
          if [ -z "$ID" ]; then echo "no workflow_runs id captured, skipping outcome log"; exit 0; fi
          REASON_JSON=$(node -e "console.log(JSON.stringify(process.env.WORKFLOW_NOOP_REASON || null))")
          curl -s -X PATCH "https://kbjqxaukyawcmcyjoiey.supabase.co/rest/v1/workflow_runs?id=eq.$ID" \
            -H "apikey: sb_publishable_JXOwCMF_a5ylZL8V5mwfzw_MRivRMpl" \
            -H "Content-Type: application/json" \
            -d "{\"completed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"job_status\": \"${{ job.status }}\", \"is_noop\": ${WORKFLOW_IS_NOOP:-false}, \"noop_reason\": $REASON_JSON}" \
            -o /dev/null

      - name: Commit dry-run artifact, if one was written
        if: always()
        run: |
          git config user.name "log-signals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/signal-log-dry-runs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No dry-run artifact to commit."
          else
            git commit -m "Signal log dry run (EDGE) $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
