name: Log EDGE signals

# Phase 7's second engine -- see scripts/log-signals-edge.mjs's header for
# the full design. workflow_dispatch ONLY for now, deliberately, same
# bootstrap Warrior's own logger went through: no schedule until the
# dry-run output has actually been reviewed and a request-cost-aware
# schedule proposed and approved.
#
# dry_run defaults to true. Same reasoning as log-signals-warrior.yml:
# signal_log is insert-only for anon (no UPDATE, no DELETE), so a wrong
# row has no cleanup path short of the SQL editor -- the default and the
# safe path must be the same value.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = compute and log only, write nothing to Supabase. Must be explicitly set to false to write for real."
        required: true
        default: "true"

permissions:
  contents: write

jobs:
  log-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run logger
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            ARGS="--write"
          fi
          echo "Running: node scripts/log-signals-edge.mjs $ARGS"
          node scripts/log-signals-edge.mjs $ARGS

      - name: Commit dry-run artifact, if one was written
        if: always()
        run: |
          git config user.name "log-signals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/signal-log-dry-runs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No dry-run artifact to commit."
          else
            git commit -m "Signal log dry run (EDGE) $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
