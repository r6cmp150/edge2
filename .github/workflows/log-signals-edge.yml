name: Log EDGE signals

# Phase 7's second engine -- see scripts/log-signals-edge.mjs's header for
# the full design.
#
# SCHEDULE (2026-10-09) -- AIMED AT GITHUB'S OBSERVED DELIVERY, NOT AT THE
# INTENDED MOMENT. These crons are NOT the times scans happen.
#
# Measured from every run's declared_cron, Sep 15-Oct 8: GitHub delivers
# this repo's scheduled runs hours late, in order, compressed, and the
# delay SHRINKS the later the declared time (median declared -> delivered):
#   06:00Z -> ~11:55Z (backup-tables)     13:45Z -> ~19:00Z (movers)
#   14:00Z -> ~18:50Z (this file, old)    20:15Z -> ~23:45Z (this file, old)
# Jitter is +-1-2h day to day; both Mondays in the sample ran ~2h later.
# The old schedule (14:00-20:15Z, aimed at open+30/open+140/close-45)
# therefore delivered 11:45am-5pm PT -- never the 6:30-8:00am PT window
# Roman actually trades -- and the script's ±10-min target check turned
# nearly every delivery into a silent no-op (10 of 20 trading days had no
# EDGE row at all).
#
# RE-AIMED 2026-10-27 (phase-10 spec §7.6 1f, "THE BOTTLENECK HAS MOVED").
# The 07:30-09:40Z schedule below this line's history landed 05:40-07:37
# PDT (66 of 66 delivered, 4.5-10h late): the first hour, which the timing
# analysis rules out, and none of the 07:30-11:00 PT window it supports.
# Qualifying signals on 10-23 and 10-26 appeared at 10:00-12:00, after the
# last scan.
#
# TARGET: 07:30-11:00 PST, one landing every 30 min (8 slots), aimed at
# PST because DST ends 2026-11-01 and the count restarts on the new clock.
# Until then (10-28..10-30, PDT) every landing is one hour later in PT
# wall clock, about 08:30-12:00: still in session.
# MODEL, from workflow_runs 10-12..10-26, Tue-Fri only, the median delay
# of each of the ten crons declared 07:30-15:00Z:
#   07:30Z 332 | 07:55Z 312 | 08:20Z 326 | 08:45Z 315 | 09:10Z 319 |
#   09:40Z 297 | 13:45Z 265 | 14:30Z 251 | 14:45Z 242 | 15:00Z 246 (min)
#   least squares: delay = 412.7 - 11.19 x declared_hour (minutes)
# SOLVE: landing L = D + delay(D)/60, so D = (L - 412.7/60) / (1 - 11.19/60).
# Each target, PST -> UTC (+8h) -> declared (rounded to 5 min):
#   07:30 -> 15:30Z -> 10:35Z (delay 294)    09:30 -> 17:30Z -> 13:05Z (266)
#   08:00 -> 16:00Z -> 11:15Z (287)          10:00 -> 18:00Z -> 13:40Z (260)
#   08:30 -> 16:30Z -> 11:50Z (280)          10:30 -> 18:30Z -> 14:15Z (253)
#   09:00 -> 17:00Z -> 12:25Z (274)          11:00 -> 19:00Z -> 14:55Z (246)
# SPREAD around a median: p10 -26 min, p90 +132 min (late is the long tail).
# MONDAYS ran +113 min later (3 Mondays; not special-cased, revisit).
# WE EXPECT THIS SCHEDULE TO BE WRONG, and a week of workflow_runs will
# correct it. Five of these eight sit between 09:40Z and 13:45Z, where
# nothing has EVER been declared: a line drawn between two islands of data,
# not interpolation inside a sampled region. The true delay there could
# be anything. Its first job is to be falsified; don't defend it. And the
# two islands are different workflows (this file 07:30-09:40Z, the movers
# capture 13:45-15:00Z). Re-fit on this file's own six points alone, the
# line is 412.6 - 11.20 x h (declared times move by at most a minute), and
# it predicts the movers island within 6 min. That's consistent with an
# hour effect, but can't rule out a workflow difference that happens to
# match one.
# OVERSAMPLING, ON PURPOSE: with -26/+132 min around each median, eight
# slots spread across roughly 07:00-13:00 PST, and three to five are
# expected inside 07:30-11:00. A slot is a chance, not a scan time.
# Nothing reads "the 07:30 slot" as a 07:30 scan: scans are timed by
# scan_runs.started_at / signal_log.first_shown_at, and a landing before
# 07:30 is harmless (the entry gate blocks buying, not scanning).
# CHECK after one week, PER SLOT (exclude workflow_name 'db023-verify'):
# delivered vs declared, landing time, and Mondays broken out first.
#
# Missing the target is no longer fatal: scripts/lib/scan-gate.mjs scans
# on ANY delivery that lands in the regular session (subject to 30-min
# spacing), so a late delivery is a midday row, not a no-op. Only a
# delivery before the open is lost. Earliest-sighting-wins dedup in
# signal_log means that when this schedule works, a symbol's row is its
# morning sighting.
#
# DST: this schedule is aimed at PST (UTC-8). On the March 2027 change
# back to PDT, every landing moves an hour LATER in PT wall clock: re-aim
# then, from that season's workflow_runs, not by a blind -1h. The scan
# gate is DST-safe on its own (it reads PT wall clock); only the AIM moves.
#
# Alpaca rate budget: unchanged per run; no entry shares a minute with
# capture-movers-snapshot (13:45/14:30/14:45/15:00Z), backup-tables
# (06:00Z) or log-signals-warrior (09:20-11:10Z).
#
# dry_run input still defaults to true for a MANUAL workflow_dispatch --
# unaffected by the schedule going live in --write mode below. A schedule-
# triggered firing always runs with --write; dry_run is workflow_dispatch-
# only and reads as empty on a schedule trigger, so the run step branches
# on github.event_name, not just the input, to decide -- same asymmetry as
# log-signals-warrior.yml and for the same reason: signal_log is
# insert-only for anon, so a wrong row has no cleanup path short of the
# SQL editor.
on:
  schedule:
    - cron: '35 10 * * 1-5'  # -> ~07:30 PST
    - cron: '15 11 * * 1-5'  # -> ~08:00
    - cron: '50 11 * * 1-5'  # -> ~08:30
    - cron: '25 12 * * 1-5'  # -> ~09:00
    - cron: '5 13 * * 1-5'   # -> ~09:30
    - cron: '40 13 * * 1-5'  # -> ~10:00
    - cron: '15 14 * * 1-5'  # -> ~10:30
    - cron: '55 14 * * 1-5'  # -> ~11:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = compute and log only, write nothing to Supabase. Must be explicitly set to false to write for real."
        required: true
        default: "true"

permissions:
  contents: write

jobs:
  log-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Log workflow firing (Phase 9 §2.7 scheduler instrumentation)
        id: log_fired
        run: |
          # declared_cron is NULL when there was no cron (workflow_dispatch), never
          # '': delay queries compare actual_fired_at with the declared time, and
          # NULL is what "where declared_cron is not null" naturally excludes.
          CRON='${{ github.event.schedule }}'
          if [ -n "$CRON" ]; then CRON_JSON="\"$CRON\""; else CRON_JSON=null; fi
          ROW=$(curl -s -X POST "https://kbjqxaukyawcmcyjoiey.supabase.co/rest/v1/workflow_runs" \
            -H "apikey: sb_publishable_JXOwCMF_a5ylZL8V5mwfzw_MRivRMpl" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"workflow_name\": \"${{ github.workflow }}\", \"trigger_type\": \"${{ github.event_name }}\", \"declared_cron\": $CRON_JSON, \"actual_fired_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}")
          echo "$ROW"
          echo "id=$(echo "$ROW" | jq -r 'if type=="array" then (.[0].id // empty) else empty end' 2>/dev/null || echo)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run logger
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "false" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="--write"
          fi
          echo "Running: node scripts/log-signals-edge.mjs $ARGS"
          node scripts/log-signals-edge.mjs $ARGS

      - name: Commit dry-run artifact, if one was written
        if: always()
        run: |
          git config user.name "log-signals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/signal-log-dry-runs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No dry-run artifact to commit."
          else
            git commit -m "Signal log dry run (EDGE) $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      # LAST STEP, if: always() (2026-10-09): job_status must be written
      # AFTER every step that can fail the job (commit/push, deliberate
      # fail steps), or it records the state before the fact existed.
      # job.status, never a literal. NULL job_status = this step never ran.
      - name: Log workflow outcome (Phase 9 §2.7)
        if: always()
        run: |
          ID="${{ steps.log_fired.outputs.id }}"
          if [ -z "$ID" ]; then echo "::error::workflow_runs insert returned no id -- the §2.7 firing log is writing nowhere (see the firing step output: missing table, RLS, or Supabase down). Failing on purpose: as a skip this stayed silent for 24 days across all six workflows."; exit 1; fi
          REASON_JSON=$(node -e "console.log(JSON.stringify(process.env.WORKFLOW_NOOP_REASON || null))")
          # is_noop: true|false from reportNoopDecision via $GITHUB_ENV; unset or
          # empty -> JSON null ("not determined" -- the script died before
          # deciding). UNQUOTED on purpose: the string "null" would hit a boolean
          # column and fail the PATCH. Never :-false -- that fabricated "did real
          # work" for every crashed run until 2026-10-09.
          PAYLOAD="{\"completed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"job_status\": \"${{ job.status }}\", \"is_noop\": ${WORKFLOW_IS_NOOP:-null}, \"noop_reason\": $REASON_JSON}"
          echo "workflow_runs outcome PATCH payload: $PAYLOAD"
          curl -sS --fail -X PATCH "https://kbjqxaukyawcmcyjoiey.supabase.co/rest/v1/workflow_runs?id=eq.$ID" \
            -H "apikey: sb_publishable_JXOwCMF_a5ylZL8V5mwfzw_MRivRMpl" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            -o /dev/null
