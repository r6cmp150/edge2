name: Log Warrior signals

# Phase 7's actual deliverable -- see scripts/log-signals-warrior.mjs's
# header for the full design (universe provenance, scan completeness,
# dry-run-by-default).
#
# SCHEDULED (2026-09-10, six paired cron entries; REPLACED 2026-09-11
# after the first real unattended day showed the pairing's own assumption
# was wrong). Original design: two cron entries per intended
# market-relative moment (one for EDT, one for EST), with scripts/log-
# signals-warrior.mjs's own tolerance check picking whichever offset was
# real that day. That correctly handles DST -- but it assumes GitHub
# fires a scheduled cron close to its stated time, and on 2026-09-11 it
# didn't: all six firings landed hours late and clustered together
# (13:50 fired at 17:17 UTC, 20:00 fired at 22:24 UTC), collapsing three
# intended distinct moments into a window where only ONE happened to land
# inside the +/-10min tolerance by chance. The tolerance check itself did
# exactly its job -- five firings correctly refused to write rather than
# stamp a scan taken at open+227 as if it were open+20 -- but the design
# only budgeted one real chance per moment, and GitHub didn't deliver even
# that reliably.
#
# FIX: stop trying to fire at the right moment; fire often and let the
# SAME unchanged tolerance check select which firings do real work. A
# firing that misses every target no-ops in ~10 seconds (measured: every
# no-op run today completed in 8-11s) and makes zero Alpaca requests --
# this repo is public, so GitHub Actions minutes are free and unlimited
# regardless of density. Same move as sipSafeEndParams (core/api-
# client.js): when the unreliable thing is GitHub's delivery time, stop
# depending on knowing it in advance -- need many chances, not a few exact
# ones.
#
# `10,25,40,55 13-20 * * 1-5` -- every 15 minutes, 13:10 through 20:55 UTC,
# weekdays. Covers both EDT and EST offsets of all three targets (open+20,
# open+105, close-60; tolerance +/-10min, unchanged in the script) with at
# least two firings landing inside every one of the six DST-offset
# windows -- verified by direct computation, not assumed. A DENSE schedule
# introduces a new requirement the sparse one never needed: a target can
# now be satisfied more than once (two 15-minute-apart firings, or
# GitHub's own delay, could both land inside one +/-10min window) --
# scripts/log-signals-warrior.mjs's no-op check now also queries today's
# existing scan_runs before proceeding, so only the FIRST firing to reach
# a given target actually scans; every later one inside the same window
# no-ops too, having recognized the target as already satisfied.
#
# Staggered against capture-movers-snapshot.yml's 13:45/14:30/15:00 UTC,
# log-signals-edge.yml's :00/:05/:15/:50 UTC slots, and backup-tables.yml's
# 06:00 UTC -- this schedule's :10/:25/:40/:55 minutes never land on any
# of those, so no two scheduled jobs in this repo share a minute against
# the one shared Alpaca rate-limit queue.
#
# dry_run input still defaults to true for a MANUAL workflow_dispatch --
# unaffected by the schedule going live in --write mode below. A schedule-
# triggered firing always runs with --write (that's the whole point of
# scheduling instead of dispatching by hand); dry_run/session inputs are
# workflow_dispatch-only and read as empty on a schedule trigger, so the
# run step branches on github.event_name, not just the inputs, to decide.
# The one workflow in this repo where the manual-trigger default and the
# scheduled behavior deliberately differ -- signal_log is insert-only for
# anon (no UPDATE, no DELETE), so a wrong row has no cleanup path short of
# the SQL editor, which is exactly why manual runs still default to safe
# and schedule runs don't get a dry-run option at all.
on:
  schedule:
    - cron: '10,25,40,55 13-20 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = compute and log only, write nothing to Supabase. Must be explicitly set to false to write for real."
        required: true
        default: "true"
      session:
        description: "Override the detected market session (OPEN/PRE/AH/CLOSED). Leave blank to use the real current session."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  log-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run logger
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "false" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="--write"
          fi
          if [ -n "${{ github.event.inputs.session }}" ]; then
            ARGS="$ARGS --session=${{ github.event.inputs.session }}"
          fi
          echo "Running: node scripts/log-signals-warrior.mjs $ARGS"
          node scripts/log-signals-warrior.mjs $ARGS

      - name: Commit dry-run artifact, if one was written
        if: always()
        run: |
          git config user.name "log-signals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/signal-log-dry-runs/ 2>/dev/null || true
          # BUG FOUND LIVE (2026-09-05, first real run): `git diff --cached
          # --quiet || git push` looks like the same commit-guard pattern
          # used one line above, but it isn't -- by the time this line
          # runs, `git commit` has already cleared the staged diff, so
          # `git diff --cached --quiet` reports "nothing staged" and the
          # push after `||` never executes. The first dry run's commit
          # landed locally in the runner and was never pushed -- lost when
          # the runner was torn down, since nothing else ever points at
          # that commit object. Fixed by tracking whether a commit
          # actually happened instead of re-checking the (now-empty)
          # staged diff.
          if git diff --cached --quiet; then
            echo "No dry-run artifact to commit."
          else
            git commit -m "Signal log dry run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
