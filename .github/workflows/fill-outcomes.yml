name: Fill outcomes

# scripts/fill-outcomes.mjs had no production run path at all until this
# file (phase-9-entry-exit-spec.md §2.5, found 2026-09-15): the 33
# signal_log rows carrying ret_1d were filled by a hand-run, and
# OUTCOME_FILLER_JWT existed only as a value someone had to paste into a
# local shell. This workflow is that path -- workflow_dispatch (used to
# run every one-off verification step in §1/§2.5 rather than handing the
# token to a local shell) plus a daily schedule.
#
# OUTCOME_FILLER_JWT: confirmed missing via `gh secret list` earlier
# 2026-09-15, then added the same day (confirmed present via a second
# `gh secret list` and a real dispatch that used it successfully). CURRENT
# TOKEN: minted 2026-09-15, expires 2027-09-15T17:27:14Z. RENEW BY THAT
# DATE -- re-run
#   SUPABASE_JWT_SECRET=... node scripts/sign-supabase-role-jwt.mjs outcome_filler 365
# and update the secret. An expired or missing token fails this job loud
# (401/403 -> assertNotAuthFailure in fill-outcomes.mjs -> exit 1 ->
# GitHub Actions failure notification), not silent.
#
# TWO OLDER TOKENS ARE ALSO STILL VALID, NEITHER IS IN THE SECRET ANYMORE:
# outcome_filler's original 365-day mint (db/017, minted 2026-09-10,
# expires 2027-09-11) was superseded by the 2026-09-15 one above, and
# before that, outcome_filler's very first mint (also 2026-09-10) omitted
# sign-supabase-role-jwt.mjs's `days` argument and got that script's old
# default of 3650 days by accident (see sign-supabase-role-jwt.mjs's own
# header -- the script no longer has any default, for this exact reason).
# A JWT cannot be revoked short of rotating the underlying Supabase
# project JWT secret -- so if a copy of either older mint survives
# anywhere (a shell history, an old log, a chat), it remains a valid
# outcome_filler bearer credential with UPDATE rights until ITS OWN
# expiry (2027-09-11 for the second mint, roughly 2036-09-07 for the
# accidental first one), regardless of which token is in this workflow's
# secret today. Nobody rotated the underlying secret over this, per the
# JWT-exposure decision already on record for this project -- so treat
# both older tokens' continued validity as live, not historical.
#
# NOT TIME-SENSITIVE THE WAY log-signals-edge/warrior ARE: this job's own
# per-row/per-column gating (tradingDayHasClosed, the array-position
# "not enough real sessions yet" checks in fill-outcomes.mjs and
# scripts/lib/sell-timing.mjs) makes it CORRECT to run at any time of day,
# any day late -- there is no "wrong season" concept here, unlike the
# DST-paired intraday loggers. Three modestly-spaced cron entries, not a
# dense every-15-minute schedule: 2026-09-14's investigation
# (phase-9-entry-exit-spec.md §2.4) found GitHub Actions dropped ~94% of a
# dense (every-15-min) cron outright, while a sparser 6-times-daily
# schedule delivered all six, just badly late. Given this job tolerates
# lateness fine and doesn't need multiple daily samples, a small number of
# spaced firings plus a real /v2/clock check (not a bare cron-time
# assumption -- see --scheduled in fill-outcomes.mjs) is the appropriate
# amount of defense for a job where a day's delay is low-stakes, not the
# dense oversampling position_bars will need once §2.4's scheduler
# question is settled.
#
# --scheduled is passed ONLY on the cron trigger, never workflow_dispatch
# -- same asymmetry as log-signals-edge.yml's --write branch, and for the
# same reason: a human dispatching this manually has already decided it's
# the right moment; a cron firing hasn't, and 2026-09-14 is exactly why
# that decision now goes through a live /v2/clock check instead of trust
# in the declared time.
on:
  schedule:
    - cron: '30 20 * * 1-5' # ~20-30 min after EDT close (20:00 UTC); the /v2/clock check inside the script is the real gate, this is just roughly the right neighborhood
    - cron: '30 21 * * 1-5' # ~30 min after EST close (21:00 UTC) -- covers the other DST half and serves as a retry if the first firing was late/dropped
    - cron: '0 23 * * 1-5'  # final same-day retry, well past either close
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = compute and log only, write nothing to Supabase. Must be explicitly set to false to write for real."
        required: true
        default: "true"
      run_grant_checks:
        description: "true = also run audit-signal-log-splits.mjs --write and the db/019+db/021 grant boundary checks (scripts/test-db019-db021-grants.mjs) as extra steps. One-off verification, not part of the daily schedule -- see phase-9-entry-exit-spec.md §2.5 on why workflow_dispatch, not a local shell, is the right way to run these."
        required: true
        default: "false"

permissions:
  contents: write

jobs:
  fill-outcomes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run filler
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          OUTCOME_FILLER_JWT: ${{ secrets.OUTCOME_FILLER_JWT }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="--write --scheduled"
          elif [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            ARGS="--write"
          else
            ARGS=""
          fi
          echo "Running: node scripts/fill-outcomes.mjs $ARGS"
          node scripts/fill-outcomes.mjs $ARGS

      - name: Run split audit (audit-signal-log-splits.mjs --write)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_grant_checks == 'true'
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          OUTCOME_FILLER_JWT: ${{ secrets.OUTCOME_FILLER_JWT }}
        run: node scripts/audit-signal-log-splits.mjs --write

      - name: Run db/019 + db/021 grant boundary checks
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_grant_checks == 'true'
        env:
          OUTCOME_FILLER_JWT: ${{ secrets.OUTCOME_FILLER_JWT }}
        run: node scripts/test-db019-db021-grants.mjs

      - name: Commit dry-run artifact, if one was written
        if: always()
        run: |
          git config user.name "fill-outcomes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/outcome-fill-dry-runs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No dry-run artifact to commit."
          else
            git commit -m "Fill-outcomes dry run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase
            git push
          fi
