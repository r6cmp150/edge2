name: Build float table

# See scripts/build-float-table.mjs's header comment for why this exists:
# SEC's EDGAR API (data.sec.gov/www.sec.gov) sends no
# Access-Control-Allow-Origin and 403s any CORS preflight -- a browser can
# never call it directly. This job does the same derivation
# core/edgar.js's getFloatDataForSymbols always did, from Node (where CORS
# doesn't apply), for the whole instrument-eligible universe, and commits
# the settled verdicts to data/float-table.json for the live app to read
# same-origin. Same pattern as data/movers-snapshots/log.jsonl
# (capture-movers-snapshot.yml).
#
# Weekly, not daily (2026-09-04 decision): EntityPublicFloat is an annual
# figure, already 6-18 months stale by nature -- a week's table age is
# noise against that. Sunday 08:00 UTC: well before Monday's market open,
# low-traffic time for the commit, and gives the whole weekend as slack if
# a re-run via workflow_dispatch is ever needed before Monday.
on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The full ~5,700-symbol universe at SEC's self-imposed ~8/s pace plus
    # Alpaca historical-bar lookups measured around 20-45 minutes locally
    # (scripts/build-float-table.mjs's own reported buildDurationSeconds) --
    # generous headroom over the default 6h job timeout isn't needed, but
    # an explicit ceiling here documents the expected order of magnitude
    # rather than leaving a silent default.
    timeout-minutes: 90
    steps:
      - name: Log workflow firing (Phase 9 §2.7 scheduler instrumentation)
        id: log_fired
        run: |
          ROW=$(curl -s -X POST "https://kbjqxaukyawcmcyjoiey.supabase.co/rest/v1/workflow_runs" \
            -H "apikey: sb_publishable_JXOwCMF_a5ylZL8V5mwfzw_MRivRMpl" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"workflow_name\": \"${{ github.workflow }}\", \"trigger_type\": \"${{ github.event_name }}\", \"declared_cron\": \"${{ github.event.schedule }}\", \"actual_fired_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}")
          echo "$ROW"
          echo "id=$(echo "$ROW" | jq -r 'if type=="array" then (.[0].id // empty) else empty end' 2>/dev/null || echo)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build float table
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: node scripts/build-float-table.mjs

      - name: Commit and push
        run: |
          git config user.name "float-table-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/float-table.json
          git diff --cached --quiet || git commit -m "Float table rebuild $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      # LAST STEP, if: always() (2026-10-09): job_status must be written
      # AFTER every step that can fail the job (commit/push, deliberate
      # fail steps), or it records the state before the fact existed.
      # job.status, never a literal. NULL job_status = this step never ran.
      - name: Log workflow outcome (Phase 9 §2.7)
        if: always()
        run: |
          ID="${{ steps.log_fired.outputs.id }}"
          if [ -z "$ID" ]; then echo "::error::workflow_runs insert returned no id -- the §2.7 firing log is writing nowhere (see the firing step output: missing table, RLS, or Supabase down). Failing on purpose: as a skip this stayed silent for 24 days across all six workflows."; exit 1; fi
          REASON_JSON=$(node -e "console.log(JSON.stringify(process.env.WORKFLOW_NOOP_REASON || null))")
          # is_noop: true|false from reportNoopDecision via $GITHUB_ENV; unset or
          # empty -> JSON null ("not determined" -- the script died before
          # deciding). UNQUOTED on purpose: the string "null" would hit a boolean
          # column and fail the PATCH. Never :-false -- that fabricated "did real
          # work" for every crashed run until 2026-10-09.
          PAYLOAD="{\"completed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"job_status\": \"${{ job.status }}\", \"is_noop\": ${WORKFLOW_IS_NOOP:-null}, \"noop_reason\": $REASON_JSON}"
          echo "workflow_runs outcome PATCH payload: $PAYLOAD"
          curl -sS --fail -X PATCH "https://kbjqxaukyawcmcyjoiey.supabase.co/rest/v1/workflow_runs?id=eq.$ID" \
            -H "apikey: sb_publishable_JXOwCMF_a5ylZL8V5mwfzw_MRivRMpl" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            -o /dev/null
